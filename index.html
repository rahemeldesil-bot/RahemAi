
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahem AI - ذكاء اصطناعي حقيقي</title>
<style>
body{font-family:system-ui;background:#0f0f0f;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{padding:15px;background:#1a1a1a;text-align:center;border-bottom:1px solid #333}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 15px;border-radius:15px;max-width:85%}
.user{background:#2563eb;align-self:flex-end}
.ai{background:#262626;align-self:flex-start;border:1px solid #333}
.input-area{display:flex;padding:15px;gap:10px;background:#1a1a1a}
input{flex:1;padding:12px;border-radius:25px;border:1px solid #333;background:#262626;color:white;outline:none}
button{padding:12px 20px;border-radius:25px;border:none;background:#2563eb;color:white;font-weight:bold}
#setup{background:#1a1a1a;padding:15px;border-bottom:1px solid #333}
#setup input{width:100%;box-sizing:border-box;margin-top:10px}
</style>
</head>
<body>
<div class="header">🤖 رحيم AI - شغال بذكاء حقيقي</div>
<div id="setup">
<b>أول مرة؟ حط مفتاح Gemini بتاعك هنا (مرة واحدة بس وهيتحفظ):</b>

<button onclick="saveKey()" style="margin-top:10px;width:100%">حفظ المفتاح وتشغيل الذكاء</button>
<div id="keyStatus" style="margin-top:10px;font-size:12px;color:#888"></div>
</div>
<div class="chat" id="chat"></div>
<div class="input-area">
<input id="userInput" placeholder="اسأل أي حاجة...">
<button onclick="send()">إرسال</button>
</div>
<script>
const chatEl=document.getElementById('chat');
const inputEl=document.getElementById('userInput');
const keyInput=document.getElementById('apiKeyInput');
const statusEl=document.getElementById('keyStatus');
let apiKey=localStorage.getItem('gemini_key')||'';
if(apiKey){keyInput.value=apiKey; statusEl.textContent='✅ المفتاح محفوظ وشغال'; document.getElementById('setup').style.display='none'}

function saveKey(){
  apiKey=keyInput.value.trim();
  if(!apiKey.startsWith('AIza')){alert('المفتاح شكله غلط، لازم يبدأ بـ AIza');return}
  localStorage.setItem('gemini_key',apiKey);
  statusEl.textContent='✅ تم الحفظ! دلوقتي اسأل أي حاجة';
  document.getElementById('setup').style.display='none';
}
function addMsg(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight}

async function send(){
  if(!apiKey){alert('حط مفتاح الـ API الأول فوق');return}
  const text=inputEl.value.trim(); if(!text)return;
  addMsg(text,'user'); inputEl.value='';
  addMsg('...بيفكر','ai');
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:text}]}]})
    });
    const data=await res.json();
    chatEl.lastChild.remove();
    if(data.error){addMsg('خطأ: '+data.error.message,'ai')}
    else{const reply=data.candidates[0].content.parts[0].text; addMsg(reply,'ai')}
  }catch(e){chatEl.lastChild.remove(); addMsg('فيه مشكلة في الاتصال، اتأكد من النت والمفتاح','ai')}
}
inputEl.addEventListener('keypress',e=>{if(e.key==='Enter')send()})
</script>
</body>
</html>
